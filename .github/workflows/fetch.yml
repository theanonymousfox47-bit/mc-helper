name: Fetch Metadata
on: [workflow_dispatch]
jobs:
  get-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 1.20.4 JSON
        run: |
          VERSION_URL=$(curl -s https://launchermeta.mojang.com/mc/game/version_manifest.json | jq -r '.versions[] | select(.id=="1.20.4") | .url')
          curl -s "$VERSION_URL" -o net.minecraft.json
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-metadata
          path: net.minecraft.json
