name: Fetch Roblox Installer

on: [workflow_dispatch]

jobs:
  get-roblox:
    runs-on: ubuntu-latest
    steps:
      - name: Download Roblox Player Launcher
        run: |
          curl -s -L "https://setup.roblox.com/RobloxPlayerLauncher.exe" -o RobloxPlayerLauncher.exe
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-installer
          path: RobloxPlayerLauncher.exe
