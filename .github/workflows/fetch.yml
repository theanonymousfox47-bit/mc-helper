name: Fetch Java and Minecraft
on: [workflow_dispatch]
jobs:
  get-files:
    runs-on: ubuntu-latest
    steps:
      - name: Download Portable Java 17
        run: |
          curl -L -o java17.zip https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.10%2B7/OpenJDK17U-jdk_x64_windows_hotspot_17.0.10_7.zip
      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-java
          path: java17.zip
